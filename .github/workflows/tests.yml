name: Tests

on:
    push:
        branches: [ "*.x" ]
    pull_request:
        branches: [ "*.x" ]

permissions:
    contents: read

jobs:
    build:
        name: PHP ${{ matrix.php }} + Symfony ${{ matrix.symfony }}${{ matrix.lowest && ' (lowest)' || '' }}
        runs-on: ubuntu-latest

        strategy:
            # Don't cancel the whole matrix when one combination fails:
            # we want to see every PHP/Symfony result independently.
            fail-fast: false
            matrix:
                # Explicit include-list. EasyAdmin 5 requires PHP >= 8.2 and Symfony 6.4.33+, 7.x or 8.x.
                # Only maintained Symfony lines are tested: 7.x is covered by 7.4, 8.x by its latest minor.
                include:
                    - { php: '8.2', symfony: '6.4.*', lowest: true }   # the floors declared in composer.json
                    - { php: '8.2', symfony: '6.4.*' }                 # bundle PHP floor + Symfony LTS floor
                    - { php: '8.5', symfony: '6.4.*' }                 # LTS on the newest PHP (catches deprecations)
                    - { php: '8.3', symfony: '7.4.*' }
                    - { php: '8.4', symfony: '8.1.*' }
                    - { php: '8.5', symfony: '8.1.*', lint: true }     # newest + newest

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP ${{ matrix.php }}
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  # Cache Composer's download cache (not vendor/): each matrix job
                  # installs a different Symfony set, so vendor/ must not be shared.
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}${{ matrix.lowest && '-lowest' || '' }}-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-sf${{ matrix.symfony }}-

            - name: Install Symfony Flex
              # Flex reads SYMFONY_REQUIRE and pins every symfony/* package (direct
              # and transitive) to the targeted line in a single composer update.
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Install dependencies (Symfony ${{ matrix.symfony }})
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}
              run: composer update --prefer-dist --no-progress ${{ matrix.lowest && '--prefer-lowest' || '' }}

            - name: lint
              if: matrix.lint
              run: composer run-script lint:check

            - name: phpstan
              run: composer run-script phpstan

            - name: phpunit
              run: composer run-script phpunit
